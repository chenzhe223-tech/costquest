<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CostQuest · 造价宝典</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#f1f5fa;color:#172d48}header,main{max-width:1050px;margin:auto;padding:24px}header{display:flex;justify-content:space-between}section{background:white;border-radius:16px;padding:24px;margin-bottom:16px}h1{font-size:32px;margin:0}button{font:inherit;border:1px solid #cbd8ea;border-radius:10px;background:white;color:#172d48;padding:12px;cursor:pointer}button:hover{background:#e5edff}button:disabled{opacity:.5;cursor:default}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.hero{background:#172d48;color:white}small{opacity:.75}#feedback{line-height:1.8}progress{width:100%}</style><header><b>CostQuest.</b><small>By DAVYLAB</small></header><main><section class="hero"><small>ENGINEERING ACADEMY</small><h1>造价宝典</h1><p>在游戏中学习，在工作中应用。</p><p id="status"></p></section><section><h2>职业能力课程地图</h2><div id="curriculum" aria-live="polite">加载知识库…</div></section><section><h2 id="topic">职业启航</h2><p id="note"></p><button id="start">挑战知识点</button><div id="quiz"></div><p id="feedback" aria-live="polite"></p></section><section><h2>Motion Lab · 项目阶段演示</h2><input id="phase" type="range" min="0" max="5" value="0"><p id="phaseText"></p><progress id="bar" max="6" value="1"></progress><small>阶段顺序示意，不代表固定造价误差。</small></section><footer>知识依据：《造价工程师职业能力标准》征求意见稿 · 非正式执业依据</footer></main><script>const nodes=[['职业启航','一级可独立承担全过程造价管理与咨询；二级主要协助并可独立编制计价成果。','1.0.3','一级造价工程师的工作范围？',['仅施工计价','全过程造价管理与咨询'],1],['造价基础','工程实践能力包含基本、核心和发展能力。','1.0.5','工程实践能力包括？',['基本、核心、发展','仅计量、计价'],0],['投资决策','一级应具备可行性研究、融资分析、方案比选能力。','5.3.3','哪项属于决策阶段能力？',['竣工审计','方案比选'],1],['设计管理','一级应具备设计优化、投资控制、全周期成本与价值管理能力。','5.3.4','设计阶段应重点关注？',['设计优化与投资控制','仅付款'],0],['招标采购','一级应具备招标策划、合同策划及清标能力。','5.3.5','清标属于哪个阶段？',['运维','工程交易'],1],['施工控本','一级应具备投资偏差、进度偏差分析与动态成本管理能力。','5.3.6','施工阶段需要？',['动态成本管理','仅投资估算'],0],['结算审计','一级应具备工程造价审计及项目后评价能力。','5.3.6','项目后评价属于核心能力吗？',['是','否'],0],['运维管理','一级应具备运维优化、更新改造及全寿命周期成本分析能力。','5.3.7','运维阶段应考虑？',['仅初始价格','全寿命周期成本'],1]];let done=[];try{done=JSON.parse(localStorage.getItem('cq-done')||'[]');if(!Array.isArray(done))done=[]}catch{}let current=0;const $=id=>document.getElementById(id);function render(){ $('status').textContent='已有练习掌握 '+done.length+' / '+nodes.length;}function select(i){current=i;$('topic').textContent=nodes[i][0];$('note').textContent=nodes[i][1]+'（暂定映射 '+nodes[i][2]+'，待原文复核）';$('quiz').replaceChildren();$('feedback').textContent=''}$('start').onclick=()=>{let n=nodes[current];$('quiz').replaceChildren();$('feedback').textContent='';let p=document.createElement('p');p.textContent=n[3];$('quiz').append(p);n[4].forEach((a,i)=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>{if(i===n[5]){if(!done.includes(current))done.push(current);try{localStorage.setItem('cq-done',JSON.stringify(done))}catch{}render();$('feedback').textContent='回答正确！'+n[1]}else $('feedback').textContent='再试一次：'+n[1]};$('quiz').append(b)})};const phases=['投资估算','设计概算','施工图预算','合同价款','动态成本','竣工结算'];$('phase').oninput=()=>{$('phaseText').textContent=phases[+$('phase').value];$('bar').value=+$('phase').value+1};$('phase').oninput();render();select(0);$('start').disabled=true;</script><script type="module">
const root=document.querySelector('#curriculum');
try {
 const response=await fetch('./data/competency-map.json');
 if(!response.ok) throw Error('HTTP '+response.status);
 const data=await response.json();
 const select=document.createElement('select');
 select.setAttribute('aria-label','学习路线');
 for(const [value,label] of [['junior','二级路线'],['senior','一级路线']]){const option=document.createElement('option');option.value=value;option.textContent=label;select.append(option)}
 const grid=document.createElement('div');grid.className='grid';
 const note=document.createElement('p');note.textContent=data.source.note;
 const detail=document.createElement('p');detail.setAttribute('aria-live','polite');
 function render(){grid.replaceChildren();for(const n of data.nodes.filter(n=>n.route==='all'||n.route===select.value)){const b=document.createElement('button');b.textContent=n.title+' · '+n.clause;b.onclick=()=>{const mapping={foundation:[0,1],'stage-0':[2],'stage-1':[3],'stage-2':[4],'stage-3':[5,6],'stage-4':[7]};const lessons=mapping[n.id]||[]; $('quiz').replaceChildren();$('feedback').textContent='';$('start').disabled=!lessons.length;$('topic').textContent=n.title;$('note').textContent=lessons.length?'请选择练习（条款待复核）':'本章节练习待编制';for(const i of lessons){const lesson=document.createElement('button');lesson.textContent=nodes[i][0];lesson.onclick=()=>select(i);$('quiz').append(lesson)}if(lessons.length)current=lessons[0];detail.textContent=n.title+'｜章节 '+n.clause+'｜前置知识：'+(n.prerequisites.map(id=>data.nodes.find(x=>x.id===id)?.title||id).join('、')||'无')+'｜条款待原文复核';};grid.append(b)}detail.textContent='请选择知识节点';}
 select.onchange=()=>{render();$('start').disabled=true;$('quiz').replaceChildren();$('feedback').textContent='';$('topic').textContent='请选择课程';$('note').textContent='';};root.replaceChildren(select,note,grid,detail);render();
}catch(e){root.textContent='知识库加载失败，请刷新重试。';}
</script></html>
